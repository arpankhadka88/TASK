image: atlassian/default-image:latest

pipelines:
  default:
    - step:
        name: Changes since tagged commit
        script:
          # Fetch all branches and tags
          - git fetch --all --tags

          # Print reference tag and current commit safely
          - |
            echo "Reference tag: ${REFERENCE_TAG}"
            echo "Current commit: $(git rev-parse --short HEAD)"

          # Validate tag exists
          - |
            if ! git rev-parse "${REFERENCE_TAG}" >/dev/null 2>&1; then
              echo "❌ Tag '${REFERENCE_TAG}' does not exist"
              exit 1
            fi

          # List commits after the tag
          - |
            echo "📌 Commits after tag ${REFERENCE_TAG}:"
            git log "${REFERENCE_TAG}"..HEAD --oneline

          # List files changed after the tag
          - |
            echo "📁 Files changed after tag ${REFERENCE_TAG}:"
            git diff --name-only "${REFERENCE_TAG}"..HEAD

          # Show detailed changes (file + hunks)
          - |
            echo "🧩 Detailed changes:"
            git diff "${REFERENCE_TAG}"..HEAD
